name: DAST

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch: {}

permissions:
  contents: read

env:
  TARGET_URL: ${{ secrets.TARGET_URL }}
  DD_URL: ${{ secrets.DD_URL }}
  DD_API_KEY: ${{ secrets.DD_API_KEY }}
  DD_ENGAGEMENT_ID: ${{ secrets.DD_ENGAGEMENT_ID }}

jobs:
  zap-baseline:
    name: ZAP Baseline (site)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate TARGET_URL
        run: |
          if [ -z "${{ env.TARGET_URL }}" ]; then
            echo "❌ ERROR: TARGET_URL secret is not set"
            exit 0
          fi
          if [[ ! "${{ env.TARGET_URL }}" =~ ^http ]]; then
            echo "❌ ERROR: TARGET_URL must start with http:// or https://"
            exit 0
          fi
          echo "✅ Using TARGET_URL=${{ env.TARGET_URL }}"

      # Запуск ZAP Baseline
      - name: Run ZAP Baseline
        run: |
          docker run --rm -v $(pwd):/zap/wrk/:rw -t ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
            -t ${{ env.TARGET_URL }} \
            -J report_json.json \
            -r report_html.html || true

      # Сохраняем отчёт
      - name: Upload ZAP report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap_baseline_report
          path: |
            report_json.json
            report_html.html
          if-no-files-found: ignore

      # Загружаем в DefectDojo
      - name: Upload to DefectDojo (reimport → import)
        if: ${{ env.DD_URL != '' && env.DD_API_KEY != '' && env.DD_ENGAGEMENT_ID != '' }}
        run: |
          test -f report_json.json || { echo "⚠️ ZAP report not found, skipping upload"; exit 0; }

          curl -sS -X POST "$DD_URL/api/v2/reimport-scan/" \
            -H "Authorization: Token $DD_API_KEY" \
            -F "engagement=$DD_ENGAGEMENT_ID" \
            -F "scan_type=ZAP Scan" \
            -F "file=@report_json.json" \
            -F "test_title=ZAP Baseline" \
            -F "build_id=$GITHUB_RUN_NUMBER" \
            -F "commit_hash=$GITHUB_SHA" \
            -F "branch_tag=$GITHUB_REF_NAME" \
            -F "close_old_findings=True" \
          || curl -sS -X POST "$DD_URL/api/v2/import-scan/" \
            -H "Authorization: Token $DD_API_KEY" \
            -F "engagement=$DD_ENGAGEMENT_ID" \
            -F "scan_type=ZAP Scan" \
            -F "file=@report_json.json" \
            -F "test_title=ZAP Baseline" \
            -F "build_id=$GITHUB_RUN_NUMBER" \
            -F "commit_hash=$GITHUB_SHA" \
            -F "branch_tag=$GITHUB_REF_NAME" \
            -F "active=True" -F "verified=False"
